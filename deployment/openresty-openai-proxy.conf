# ============================================================
# OpenAI API 代理 - 1Panel OpenResty 配置
# 域名: oaiapi.naivehero.top
#
# 功能：
#   1. CORS 支持（浏览器跨域调用）
#   2. WebSocket 代理（OpenAI Realtime API）
#   3. WebRTC/client_secrets 端点透传
#   4. 自定义 Key → 真实 OpenAI Key 替换（保护真实 Key）
#   5. 未授权请求拒绝
#
# 使用方法：
#   1. 在 1Panel 创建网站 oaiapi.naivehero.top
#   2. 申请 SSL 证书（1Panel 自动处理）
#   3. 进入网站「proxy/root.conf」，将本文件内容替换原有内容
#   4. 修改以下两个 set 变量的值
# ============================================================

# ── 配置变量（⚠️ 必改）───────────────────────────────────
set $openai_real_key "sk-YOUR_REAL_OPENAI_API_KEY_HERE";
set $custom_key      "sk-1s98FFGBvUwEs0uH5yKQDxsxLuv9qNa4P1WadrANek8hh8TH";

# ── WebSocket：Realtime API（/v1/realtime 精确匹配）──────
location = /v1/realtime {

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-OpenAI-Agents-SDK, Sec-WebSocket-Protocol";
        add_header Access-Control-Max-Age       "86400";
        return 204;
    }

    proxy_pass            https://api.openai.com;
    proxy_ssl_server_name on;               # HTTPS 上游 SNI 必须
    proxy_http_version    1.1;

    # WebSocket 升级头（必须）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ⚠️ 关键：ephemeral key 通过 Sec-WebSocket-Protocol 子协议字段传递
    proxy_set_header Sec-WebSocket-Protocol   $http_sec_websocket_protocol;
    proxy_set_header Sec-WebSocket-Key        $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version    $http_sec_websocket_version;
    proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

    proxy_set_header Host            api.openai.com;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Access-Control-Allow-Origin "*" always;
}

# ── Realtime HTTP 端点（/v1/realtime/* WebRTC + client_secrets）──
location /v1/realtime/ {

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      "*"                                                                   always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH"                              always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, X-OpenAI-Agents-SDK" always;
        add_header Access-Control-Max-Age           "86400"                                                               always;
        add_header Access-Control-Allow-Credentials "true"                                                                always;
        return 204;
    }

    proxy_pass            https://api.openai.com;
    proxy_ssl_server_name on;
    proxy_http_version    1.1;
    proxy_set_header Host            api.openai.com;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # ⚠️ 关键：处理 Key 替换（如果是自定义 Key 则换成真 Key，否则透传临时 Key）
    # 这样前端或后端调用 /client_secrets 时可以带上伪 Key，由代理自动转换
    access_by_lua_block {
        local auth     = ngx.req.get_headers()["Authorization"]
        local expected = "Bearer " .. ngx.var.custom_key
        local real_key = ngx.var.openai_real_key

        if auth == expected then
            ngx.req.set_header("Authorization", "Bearer " .. real_key)
        end
    }

    proxy_buffering    off;
    proxy_read_timeout 300s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin      "*"                                                                   always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH"                              always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, X-OpenAI-Agents-SDK" always;
    add_header Access-Control-Allow-Credentials "true"                                                                always;
}

# ── 普通 API 请求（/v1/...）─────────────────────────────────
location /v1/ {

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      "*"                                                                   always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH"                              always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, X-OpenAI-Agents-SDK" always;
        add_header Access-Control-Max-Age           "86400"                                                               always;
        add_header Access-Control-Allow-Credentials "true"                                                                always;
        return 204;
    }

    access_by_lua_block {
        local auth     = ngx.req.get_headers()["Authorization"]
        local expected = "Bearer " .. ngx.var.custom_key
        local real_key = ngx.var.openai_real_key

        if auth == expected then
            ngx.req.set_header("Authorization", "Bearer " .. real_key)
        else
            -- 未匹配到伪 Key 且不是实时语音路径，直接拒绝
            ngx.status = 401
            ngx.say("Unauthorized: Invalid API Key.")
            ngx.exit(401)
        end
    }

    proxy_pass            https://api.openai.com;
    proxy_ssl_server_name on;
    proxy_http_version    1.1;
    proxy_set_header Host            api.openai.com;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    proxy_buffering    off;
    proxy_read_timeout 300s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin      "*"                                                                   always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH"                              always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With, X-OpenAI-Agents-SDK" always;
    add_header Access-Control-Allow-Credentials "true"                                                                always;
}

# ── 其他所有请求：拒绝 ────────────────────────────────────
location / {
    return 401 "Unauthorized\n";
}
