# ============================================================
# CozyChat 一体化部署 - docker-compose.simple.yml
#
# 包含所有服务，无外部依赖：
#   frontend  - Nginx 静态文件 + API 代理（唯一对外入口）
#   backend   - FastAPI + uvicorn
#   postgres  - PostgreSQL 16
#   redis     - Redis 7
#   qdrant    - 向量数据库
#
# 使用方法：
#   cp deployment/simple.env.example deployment/.env
#   # 编辑 .env 填写密码和 API Key
#   docker compose -f deployment/docker-compose.simple.yml --env-file deployment/.env up -d --build
# ============================================================

services:

  # ── 前端（唯一对外暴露的服务）────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend.simple
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.3}
        VITE_AMAP_MAPS_API_KEY: ${VITE_AMAP_MAPS_API_KEY:-}
        VITE_TAVILY_API_KEY: ${VITE_TAVILY_API_KEY:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_DEMO_USERNAME: ${VITE_DEMO_USERNAME:-demo}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-demo123}
        # VITE_API_BASE_URL 故意留空，前端使用相对路径，Nginx 负责代理
        VITE_API_BASE_URL: ""
    image: cozychat/frontend:simple
    container_name: cozychat-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cozychat-network

  # ── 后端 ────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend.simple
    image: cozychat/backend:simple
    container_name: cozychat-backend
    restart: unless-stopped
    environment:
      # 应用配置
      APP_NAME: CozyChat
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}

      # Demo 模式
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@cozychat.ai}

      # CORS：前端通过 Nginx 代理（同源），后端 CORS 设为 * 即可
      CORS_ORIGINS: '["*"]'

      # 数据库（使用容器名，内网通信）
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cozychat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cozychat}
      POSTGRES_USER: ${POSTGRES_USER:-cozychat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cozychat}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}

      # Redis（使用容器名）
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Qdrant（使用容器名）
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://oaiapi.naivehero.top/v1}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-4o-realtime-preview-2024-12-17}

      # 可选第三方
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: logs/app.log

    volumes:
      - ./data/backend/logs:/opt/cozychat/backend/logs
      - ./data/backend/data:/opt/cozychat/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - cozychat-network

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cozychat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cozychat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cozychat}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cozychat} -d ${POSTGRES_DB:-cozychat}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cozychat-network

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cozychat-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n '${REDIS_PASSWORD:-}' ];
             then redis-server --requirepass '${REDIS_PASSWORD}';
             else redis-server;
             fi"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cozychat-network

  # ── Qdrant ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.15
    container_name: cozychat-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - cozychat-network

# ── 持久化存储 ────────────────────────────────────────────
volumes:
  postgres_data:
    name: cozychat-postgres-data
  redis_data:
    name: cozychat-redis-data
  qdrant_data:
    name: cozychat-qdrant-data

# ── 内部网络（不对外暴露）────────────────────────────────
networks:
  cozychat-network:
    name: cozychat-network
    driver: bridge
