memory:
  # 默认向量数据库引擎
  default_engine: "qdrant"  # chromadb / qdrant / cognee
  
  # 存储模式（可通过环境变量 MEMORY_STORAGE_MODE 覆盖）
  storage_mode: "hybrid"  # dual/unified/hybrid
  
  # 异步写入配置（可通过环境变量 MEMORY_ASYNC_WRITE 覆盖）
  async_write: true
  batch_size: 10
  
  # 去重配置（可通过环境变量 MEMORY_DEDUP_* 覆盖）
  dedup:
    enabled: true
    mode: "async"  # async/off
    content_threshold: 5
    storage_threshold: 0.8
    check_interval_seconds: 300
  
  # 跨Session记忆配置
  cross_session_memory:
    enabled: true  # 是否启用跨Session记忆检索
    # true: 检索时会包含该用户在所有Session中的记忆（跨Session）
    # false: 检索时只包含当前Session的记忆（默认，更私密）
  
  # ChromaDB配置
  chromadb:
    engine: "chromadb"
    persist_directory: "./data/chroma"
    collection_prefix: "cozychat_"
    # 向量化配置
    embedding:
      # 推荐模型（按场景选择）：
      # - all-MiniLM-L6-v2: 轻量级，384维，适合资源受限（当前使用，兼容PyTorch 2.2.2）
      # - BAAI/bge-base-zh-v1.5: 中文优化，768维，平衡性能和速度（需要PyTorch 2.6+）
      # - BAAI/bge-large-zh-v1.5: 中文优化，1024维，最佳性能（需要PyTorch 2.6+）
      # - BAAI/bge-m3: 多语言，1024维，最强性能（需要PyTorch 2.6+）
      # 注意：BGE模型需要PyTorch 2.6+，当前PyTorch版本为2.2.2，暂时使用all-MiniLM-L6-v2
      model: "all-MiniLM-L6-v2"  # 暂时使用，等PyTorch 2.6发布后切换回BGE
      dimension: 384
    # 性能配置
    performance:
      batch_size: 100
      max_retries: 3
  
  # Qdrant配置
  qdrant:
    engine: "qdrant"
    # url 从环境变量 QDRANT_URL 读取，如果未设置则使用默认值
    # 默认值：http://qdrant:6333 (Docker Compose 服务名)
    # 生产环境请通过环境变量 QDRANT_URL 配置
    url: "http://qdrant:6333"  # 默认值，会被环境变量覆盖
    collection_prefix: "cozychat_"
    # 向量化配置
    embedding:
      # 推荐模型（按场景选择）：
      # - all-MiniLM-L6-v2: 轻量级，384维，适合资源受限（当前使用，兼容PyTorch 2.2.2）
      # - BAAI/bge-base-zh-v1.5: 中文优化，768维，平衡性能和速度（需要PyTorch 2.6+）
      # - BAAI/bge-large-zh-v1.5: 中文优化，1024维，最佳性能（需要PyTorch 2.6+）
      # - BAAI/bge-m3: 多语言，1024维，最强性能（需要PyTorch 2.6+）
      # 注意：BGE模型需要PyTorch 2.6+，当前PyTorch版本为2.2.2，暂时使用all-MiniLM-L6-v2
      model: "all-MiniLM-L6-v2"  # 暂时使用，等PyTorch 2.6发布后切换回BGE
      dimension: 384
    # 性能配置
    performance:
      batch_size: 100
      max_retries: 3
  
  # Cognee配置
  # ⚠️ 重要：使用 cognee-sdk 通过 HTTP API 调用 Cognee 服务
  # ⚠️ 注意：需要先部署独立的 Cognee API 服务器（端口 8000）
  # ⚠️ 注意：开发环境使用 IP 地址（192.168.66.11），生产环境可配置为服务名
  cognee:
    engine: "cognee"
    
    # ==================== API 服务器配置 ====================
    # Cognee API 服务器地址（必需）
    # 开发环境：http://localhost:8000 或 http://192.168.66.11:8000
    # 生产环境（Docker 内部）：http://cognee-api:8000
    api_url: "http://localhost:8000"  # 默认值，可通过环境变量 COGNEE_API_URL 覆盖
    # API 认证 Token（可选，如果 Cognee API 启用了认证）
    api_token: ""  # 从环境变量 COGNEE_API_TOKEN 读取（可选）
    
    # ==================== 数据目录配置（已废弃，保留用于兼容）====================
    # ⚠️ 注意：使用 SDK 后，数据目录由 Cognee API 服务器管理
    # 此配置仅用于向后兼容，实际不再使用
    data_dir: "./data/cognee"
    
    # ==================== 数据库配置（已废弃，保留用于兼容）====================
    # ⚠️ 注意：使用 SDK 后，数据库配置由 Cognee API 服务器管理
    # 这些配置仅用于向后兼容，实际不再使用
    # 数据库配置现在在 Cognee API 服务器端管理
    database_url: "postgresql://cognee_user:cognee_password@192.168.66.11:5432/cognee_db"
    vector_db_provider: "pgvector"
    graph_database_provider: "neo4j"
    graph_database_url: "bolt://192.168.66.11:7687"
    graph_database_username: "neo4j"
    graph_database_password: "pleaseletmein"
    redis_url: "redis://:cognee_redis_password@192.168.66.11:6379/0"
    s3_endpoint: "http://192.168.66.11:9000"
    s3_access_key: "minioadmin"
    s3_secret_key: "minioadmin"
    s3_bucket_name: "cognee-storage"
    s3_use_ssl: false
    
    # ==================== LLM 配置（已废弃，保留用于兼容）====================
    # ⚠️ 注意：LLM 和 Embedding 配置现在在 Cognee API 服务器端管理
    # 这些配置仅用于向后兼容，实际不再使用
    llm:
      provider: "openai"
      model: "gpt-4o-mini"
      api_key: ""
      endpoint: ""
      max_tokens: 16384
    embedding:
      provider: "openai"
      api_key: ""
      endpoint: ""
      model: "openai/text-embedding-3-large"
      dimensions: 3072
    
    # ==================== 数据集配置 ====================
    # 数据集命名规则和配置
    datasets:
      # 用户会话数据集命名模式
      user_pattern: "conversation_{user_id}"
      # 专业记忆数据集（可选，用于共享的专业知识）
      professional: []  # 例如: ["medical_knowledge", "psychology_knowledge"]
    
    # ==================== 节点集配置 ====================
    # 节点集用于在知识图谱中组织和标记数据
    node_sets:
      # 用户记忆节点集命名模式
      user: "user_{user_id}_conversations"
      # AI助手记忆节点集命名模式
      assistant: "assistant_{user_id}_conversations"
    
    # ==================== 性能配置 ====================
    performance:
      # 异步写入配置
      async_write: true  # ✅ 优先使用异步写入
      # 知识图谱构建配置
      enable_cognify: false  # 默认关闭（性能考虑），按需启用
      # 图遍历搜索配置
      enable_graph_search: false  # 默认关闭（性能考虑），只使用向量搜索
      # 批量操作大小
      batch_size: 10
    
    # ==================== 搜索配置 ====================
    search:
      default_top_k: 5  # 默认返回结果数量
      similarity_threshold: 0.7  # 相似度阈值
      use_graph_completion: false  # 是否使用图遍历（需要 enable_graph_search=true）
      use_combined_context: true  # 是否使用混合上下文
  
  # 缓存配置
  cache:
    enabled: true
    ttl_seconds: 300
    max_size: 100
  
  # 重要性评分配置
  importance:
    # 评分算法配置
    scoring:
      enabled: true
      algorithm: "default"  # default / ml / custom
      # 默认算法参数
      default:
        content_length_weight: 0.3
        keyword_weight: 0.4
        frequency_weight: 0.2
        recency_weight: 0.1
    
    # 淘汰策略配置
    eviction:
      enabled: true
      strategy: "importance_based"  # importance_based / lru / ttl
      # 基于重要性的淘汰
      importance_based:
        min_importance: 0.3
        max_memories_per_user: 1000
        check_interval_days: 7

