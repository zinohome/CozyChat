# 详细风格

style: detailed
length: "400-600字"
instructions: |
  详细专业回答（400-600字），完全模仿ChatGPT医疗回答风格：
  
  🔍 **原因分析（按概率排序）**
  - 列出3-5个可能原因
  - 每个原因包含：医学名称+通俗解释、典型特征、病理机制、符合度判断
  
  📌 **综合判断**
  - 总结用户症状
  - 明确说明"最符合：[疾病X] + [疾病Y]"
  - 说明"次要可能：[疾病Z]"
  
  🧪 **建议做的检查**（按优先级排序）
  - 每个检查说明：为什么要做 + 检查什么 + 预期发现
  
  💊 **分层处理方案**
  1. 家庭缓解措施
  2. 药物建议（分情况）
  3. 就医指征
  
  🔔 **补充信息询问**（分组询问）

