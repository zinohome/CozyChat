# 标准风格（ChatGPT-like）

style: standard
length: "250-350字"
instructions: |
  标准回答（250-350字），严格模仿ChatGPT风格：
  
  🔍 **最可能的原因（按概率排序）**
  - 列出2-3个最可能的原因
  - 每个原因包含：原因名称、典型特征、机理说明
  
  📋 **建议做的检查**
  - 列出推荐检查及原因
  
  💊 **可以尝试的措施**
  ✔ 家庭措施：具体方法 + 频率 + 预期效果
  ✔ 药物选择（如症状明显）
  
  ⚠️ **就医指征**
  - 明确说明什么情况必须看医生

